name: VyOS - Stream

on:
  workflow_dispatch:
    inputs:
      release:
        description: "VyOS Stream release (e.g. 2026.03, 1.5-stream-2025-Q2)"
        type: string
        required: true
        default: "2026.03"
      latest:
        description: "Also tag the image as latest"
        type: boolean
        default: true
  pull_request:
    branches:
    - main
    paths:
    - ".github/workflows/vyos-stream.yml"
    - "src/vyos/stream/**"

jobs:
  build-test-push:
    name: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && format('Build, test and push Docker image ({0})', inputs.release || '2026.03') || format('Build and test Docker image ({0})', inputs.release || '2026.03') }}

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: "gold-bull/vyos-stream"
      # vyos/vyos-build commit providing scripts/iso-to-oci and scripts/check-oci-container
      VYOS_BUILD_REF: f5a1e8334f772225d9e3ccdab45f6884cec28e59
      VYOS_RELEASE: ${{ inputs.release || '2026.03' }}
      PUSH: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Checkout vyos-build
      uses: actions/checkout@v4
      with:
        repository: vyos/vyos-build
        ref: ${{ env.VYOS_BUILD_REF }}
        path: vyos-build

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y minisign xorriso squashfs-tools jq xz-utils python3-pexpect

    - id: oci
      name: Convert VyOS Stream ISO to OCI rootfs tarball
      run: |
        src/vyos/stream/build.sh "$VYOS_RELEASE" vyos-build src/vyos/stream
        tarball=$(ls src/vyos/stream/vyos-*-oci-amd64.tar.xz)
        echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"

    - name: Test OCI image
      run: python3 vyos-build/scripts/check-oci-container --image "src/vyos/stream/${{ steps.oci.outputs.tarball }}"

    - id: setup_buildx
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      if: ${{ env.PUSH == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      name: Extract metadata (tags, labels) for Docker
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.VYOS_RELEASE }}
          type=raw,value=latest,enable=${{ inputs.latest != false }}
          type=sha,prefix=${{ env.VYOS_RELEASE }}-,format=short
        labels: |
          org.opencontainers.image.title=VyOS Stream ${{ env.VYOS_RELEASE }}
          org.opencontainers.image.description=VyOS Stream ${{ env.VYOS_RELEASE }} root filesystem
          org.opencontainers.image.vendor=${{ github.repository_owner }}
        annotations: |
          org.opencontainers.image.title=VyOS Stream ${{ env.VYOS_RELEASE }}
          org.opencontainers.image.description=VyOS Stream ${{ env.VYOS_RELEASE }} root filesystem
          org.opencontainers.image.vendor=${{ github.repository_owner }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: src/vyos/stream
        file: src/vyos/stream/Dockerfile
        push: ${{ env.PUSH == 'true' }}
        provenance: false
        build-args: |-
          VYOS_TARBALL=${{ steps.oci.outputs.tarball }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        builder: ${{ steps.setup_buildx.outputs.name }}
